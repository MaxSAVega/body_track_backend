# In-memory H2 so the security suite needs neither MySQL nor Supabase.
# MODE=MySQL keeps the generated DDL close to what MySQL/PostgreSQL produce,
# and DB_CLOSE_DELAY=-1 keeps the schema alive across connections.
spring.datasource.url=jdbc:h2:mem:bodytrack;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.upload.dir=./target/test-uploads
app.storage.type=local
app.rate-limit.enabled=true
app.cors.allowed-origins=

# Deliberately generous. The limiter keys on client address, and every test in
# this JVM arrives from 127.0.0.1, so production thresholds would be consumed by
# fixture setup long before a test asserts anything. The throttling behaviour is
# covered separately by RateLimitIT, which runs in its own context with a tiny
# budget.
app.rate-limit.login.max=10000
app.rate-limit.register.max=10000
app.rate-limit.refresh.max=10000
app.rate-limit.upload.max=10000

# Fixed so tests can build valid tokens. Test-scope only, never deployed.
jwt.secret=YnlzdGVzdC1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2QtbWluaW11bS0zMmI=
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=2592000000

logging.level.root=WARN
logging.level.com.rumi.body_track_backend=WARN