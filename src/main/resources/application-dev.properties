# ---------------------------------------------------------------------------
# Development profile.
#
# MySQL on localhost, matching the existing local setup so nothing has to move.
# Credentials come from the environment; if they are absent the file simply will
# not resolve, which is preferable to a checked-in root password.
#
# NOTE: the previous committed value was a plaintext MySQL root password that is
# still present in the git history. See the handover notes -- rotating it and
# purging the history were deferred and remain outstanding.
# ---------------------------------------------------------------------------

spring.profiles.active=dev

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/body_track?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Convenient locally, but never for production: it mutates the schema on start.
spring.jpa.hibernate.ddl-auto=update
# Auto-detects the dialect. Previously MySQLDialect was hardcoded, which is
# precisely the setting that would have emitted MySQL-flavoured DDL against
# PostgreSQL.
# spring.jpa.database-platform is intentionally absent.

# WARNING: prints every statement with bound values, including BCrypt hashes
# and clinical free text. Do not activate this profile anywhere that captures
# stdout.
spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=DEBUG