# ---------------------------------------------------------------------------
# Production profile.
#
# PLACEHOLDER PROFILE. The Spring Boot process itself needs nothing from this
# file -- it is pure Spring and runs anywhere.
#
# What is still undecided, and is therefore NOT set here:
#   * the hosting provider and how the JAR is run;
#   * the public hostname;
#   * where TLS terminates, and therefore whether the app terminates TLS itself;
#   * the Supabase project, its connection string and its credentials;
#   * the Supabase Storage bucket and its signed-URL TTL.
#
# Everything below is supplied by environment variables, so the same artifact
# moves between providers without a rebuild and without a committed value.
# ---------------------------------------------------------------------------

spring.profiles.active=prod

# --- Database (Supabase PostgreSQL) --------------------------------------
# Both drivers are on the classpath; the URL decides which is used. No driver
# is hardcoded, so Hibernate negotiates the dialect from the connection.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Never mutate the schema on start. Hibernate checks that the mappings match
# the database and refuses to boot if they diverge, instead of silently issuing
# DDL. Schema changes are applied through versioned migrations.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Conservative pool; Supabase's connection limit is shared and is not sized by
# this file. Tune once the plan's limits are known.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT_MS:10000}

# --- Filesystem ----------------------------------------------------------
# Point this at a mounted volume. Not a Supabase setting: local disk remains the
# store until the S3-backed ImageStorage is introduced.
app.upload.dir=${UPLOAD_DIR}

# --- Secrets -------------------------------------------------------------
# No defaults. A missing value must stop the deployment rather than fall back.
jwt.secret=${JWT_SECRET}

# --- Tokens --------------------------------------------------------------
# Short-lived access token; the session ends when it lapses unless refreshed,
# and a logout revokes refresh tokens immediately.
jwt.access-token-expiration=${ACCESS_TOKEN_MS:900000}
jwt.refresh-token-expiration=${REFRESH_TOKEN_MS:2592000000}

# --- Rate limiting -------------------------------------------------------
app.rate-limit.enabled=true

# --- CORS ----------------------------------------------------------------
# Left empty on purpose: no browser client exists, and an open CORS policy on a
# medical API is a liability rather than a convenience.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- Logging -------------------------------------------------------------
# No stack traces or SQL through the API: ApiExceptionHandler returns a fixed
# message for every internal failure. Server-side verbosity is tuned from here
# once the hosting is chosen, since it determines where logs are retained.
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.com.rumi.body_track_backend=${LOG_LEVEL_APP:INFO}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false