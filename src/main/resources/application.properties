spring.application.name=body_track_backend

# ---------------------------------------------------------------------------
# Shared, environment-agnostic settings.
#
# Secrets are NOT defined here. Every credential and every connection string is
# supplied by the active profile (application-dev / application-prod) or by an
# environment variable. There is deliberately no fallback value for jwt.secret:
# the previous default was a working signing key checked into the repository, so a
# deployment that forgot to set JWT_SECRET silently served tokens anyone could
# forge. JwtService now refuses to start without one.
# ---------------------------------------------------------------------------

server.port=${PORT:8080}

spring.jpa.show-sql=false
# Keeps the EntityManager from outliving the request; the OSIV warning also
# disappears.
spring.jpa.open-in-view=false

# Multipart ceiling. The container limit is the outer bound; the per-file and
# per-dimension checks live in ImageValidator, and neither the exception handler
# nor the limiter discloses these numbers.
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_SIZE:8MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:8MB}

# --- Image storage ------------------------------------------------------
# Provider-neutral. 'local' writes to disk through LocalFileSystemImageStorage;
# a future Supabase S3-compatible implementation will be selected here without
# any change to the domain or to authorization.
app.storage.type=${STORAGE_TYPE:local}
app.upload.dir=${UPLOAD_DIR:./uploads/anomalies}
app.upload.max-bytes=${UPLOAD_MAX_BYTES:8388608}
app.upload.max-width-px=${UPLOAD_MAX_WIDTH:6000}
app.upload.max-height-px=${UPLOAD_MAX_HEIGHT:6000}

# --- Authentication -----------------------------------------------------
# Secret comes from JWT_SECRET. Generate with: openssl rand -base64 32
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${ACCESS_TOKEN_MS:900000}
jwt.refresh-token-expiration=${REFRESH_TOKEN_MS:2592000000}

# --- Rate limiting ------------------------------------------------------
# In-memory, so per-JVM. Correct for a single instance; if the backend is ever
# scaled horizontally this must move to shared storage.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# --- CORS ---------------------------------------------------------------
# Empty means no cross-origin access is granted at all. A native Flutter client
# does not need CORS. Populate only if a browser client is added, and only with
# specific origins -- the previous wildcard-plus-credentials pairing let any site
# on the internet read authenticated responses.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- Logging ------------------------------------------------------------
# Default INFO. Anything more verbose belongs in a profile, not here, because
# DEBUG on the JPA category prints bound SQL values including password hashes
# and clinical free text.
logging.level.root=INFO
logging.level.com.rumi.body_track_backend=INFO